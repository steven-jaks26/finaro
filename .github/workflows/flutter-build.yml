name: Finaro Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK with Gradle
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew app:assembleRelease --stacktrace --info 2>&1 | tee ../gradle-release.log

      - name: Verify APK
        run: |
          echo "========================================"
          echo "APK FILES"
          echo "========================================"

          find "$GITHUB_WORKSPACE" -type f -name "*.apk" -print

          echo "========================================"
          echo "Expected Flutter APK"
          echo "========================================"

          if [ -f "$GITHUB_WORKSPACE/android/app/build/outputs/flutter-apk/app-release.apk" ]; then
            echo "APK FOUND:"
            ls -lh "$GITHUB_WORKSPACE/android/app/build/outputs/flutter-apk/app-release.apk"
          else
            echo "ERROR: Flutter APK was not found."
            exit 1
          fi

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-release-log
          path: gradle-release.log
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: finaro-release-apk
          path: android/app/build/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
