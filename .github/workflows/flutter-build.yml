name: Finaro Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Create Android local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          
      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.14.3
          chmod +x gradlew

      - name: Verify Gradle Wrapper
        run: |
          cd android
          ./gradlew --version
          
      - name: Upload Gradle Wrapper
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            android/gradlew
            android/gradlew.bat
            android/gradle/wrapper/gradle-wrapper.jar
            android/gradle/wrapper/gradle-wrapper.properties
    
      - name: Flutter version
        run: flutter --version

      - name: Gradle version
        run: gradle --version

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee build-release.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-release-log
          path: build-release.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: finaro-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
